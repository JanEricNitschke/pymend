# This workflow will lint, typecheck, and test the pymend repo
name: build

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions: {}

jobs:
  build:
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Installation
        run: uv sync --all-extras --dev

      - name: Lint with ruff
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0

      - name: Check formatting with ruff
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          args: "format --check"

      - name: Typecheck with pyright
        run: uv run pyright

      - name: Typecheck with pyrefly
        run: uv run pyrefly check --output-format=github

      - name: Typecheck with ty
        run: uv run ty check

      - name: Typecheck with zuban
        run: uv run zuban check

      - name: Typecheck with mypy
        run: uv run mypy

      - name: Thorough check with pylint
        run: uv run pylint src/pymend

      - name: Run pre-commit
        run: uv run pre-commit run --all-files

      - name: Test with pytest
        run: |
          uv run coverage run -m pytest --durations=10
          uv run coverage report -m
          uv run coverage json
          uv run coverage html

      - name: Archive code coverage results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: code-coverage-report-${{ matrix.os }}-${{ matrix.python-version }}
          path: htmlcov/

      - name: Verify tests pass after regenerating expected files
        run: |
          uv run python scripts/regen_expected.py tests/test_pymend/ -q
          uv run pytest tests/test_pymend/ -q
